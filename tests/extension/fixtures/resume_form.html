<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Data Engineer - Fixture Labs</title>
  </head>
  <body>
    <h1>Apply: Data Engineer</h1>
    <form id="application">
      <p><label for="first">First Name</label><input id="first" name="first_name" /></p>
      <p><label for="last">Last Name</label><input id="last" name="last_name" /></p>
      <p><label for="phone">Phone</label><input id="phone" name="phone" type="tel" /></p>
      <p><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin" /></p>
      <p><label for="github">GitHub URL</label><input id="github" name="github" /></p>
      <p><label for="city">City</label><input id="city" name="city" /></p>
      <p><label for="school">School</label><input id="school" name="q1" /></p>
      <p>
        <label for="degree">Degree</label>
        <select id="degree" name="q2">
          <option value="">Select...</option>
          <option>Associate's Degree</option>
          <option>Bachelor's Degree</option>
          <option>Master's Degree</option>
        </select>
      </p>
      <p><label for="major">Field of study</label><input id="major" name="q3" /></p>
      <p><label for="grad">Graduation year</label><input id="grad" name="q4" /></p>
      <p><label for="company">Current company</label><input id="company" name="q5" /></p>
      <p><label for="title">Current job title</label><input id="title" name="q6" /></p>
      <p><label for="resume">Resume/CV</label><input id="resume" name="resume" type="file" /></p>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
