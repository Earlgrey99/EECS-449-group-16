[project]
name = "EECS-449-group-16"
version = "0.1.0"
description = "Command-line Jac project"
entry-point = "main"
kind = "fullstack"
jac-version = "==0.37.11"

[dependencies]
libsql = "~=0.1"

[dev-dependencies]
watchdog = ">=3.0.0"

[check]
suppress = ["W1037", "W3030"]

[jacpack]
name = 'EECS-449-group-16'
description = 'Jac IDE snapshot for EECS-449-group-16'

[jachammer]
project_id = "prj_bf9c70c000554c7c849fc474521eea84"

[serve]
base_route_app = "app"

[jac-shadcn]
style = "vega"
baseColor = "neutral"
theme = "indigo"
font = "figtree"
radius = "default"
menuAccent = "bold"
menuColor = "default"
[dependencies.npm]
tw-animate-css = "latest"
shadcn = "latest"
"@fontsource-variable/figtree" = "latest"
"@hugeicons/react" = "latest"
"@hugeicons/core-free-icons" = "latest"
"class-variance-authority" = "latest"
"clsx" = "latest"
"tailwind-merge" = "latest"
"lucide-react" = "latest"
"sonner" = "latest"
"radix-ui" = "latest"

[dependencies.npm.dev]
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"

[plugins.client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]
